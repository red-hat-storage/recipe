---
version: 2
updates:
  # Version updates for supported product branches only (not main).
  # GitHub reads this file from the default branch; target-branch
  # selects the manifests and PR base. Directory lists match what
  # exists on each branch: root gomod and GitHub Actions. Skip
  # docker (tagged Go image plus untagged ubi-minimal).

  # --- release-5.0 ---

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go-root:
        patterns:
          - "*"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "sigs.k8s.io/controller-runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release-5.0"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

